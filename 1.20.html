<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>eaglercraft mod launcher</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #db1d3f;
      overflow: hidden;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease;
    }
    #loading-screen img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
    }
    .status-text {
      position: absolute;
      bottom: 40px;
      left: 40px;
      color: white;
      display: flex;
      align-items: center;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 15px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <img src="https://cdn.phototourl.com/member/2026-08-06-f000d71d-f274-43b6-91b8-743744b31c23.gif" alt="Loading">
    <div class="status-text">
      <div class="spinner"></div>
      <span>Initializing Mod Launcher...</span>
    </div>
  </div>

  <audio id="boot-audio" autoplay>
    <source src="https://www.image2url.com/r2/default/audio/1786047880556-8439ef7a-556f-416f-9d4e-5e3627cf4f69.mp3" type="audio/mpeg">
  </audio>

  <audio id="bg-music" loop>
    <source src="https://www.image2url.com/r2/default/audio/1786106321209-86f8c011-f93c-4173-a301-06dc0c18066a.mp3" type="audio/mpeg">
  </audio>

  <script>
    async function run() {
      // Start background music after boot sound finishes
      setTimeout(() => {
        const bgm = document.getElementById('bg-music');
        if (bgm) bgm.play().catch(()=>{});
      }, 3500);

      const urls = [
        "https://cdn.jsdelivr.net/gh/boibn/120-1@main/EaglercraftX_1.20.6_WASM-GC_Offline_Download.html.part1",
        "https://cdn.jsdelivr.net/gh/boibn/120-2@main/EaglercraftX_1.20.6_WASM-GC_Offline_Download.html.part2",
        "https://cdn.jsdelivr.net/gh/boibn/120-3@main/EaglercraftX_1.20.6_WASM-GC_Offline_Download.html.part3"
      ];
      
      let fullHtml = "";
      try {
        for (const u of urls) {
          const res = await fetch(u);
          fullHtml += await res.text();
        }
      } catch (e) {
        console.error("Fetch error:", e);
      }

      // Once the files are successfully fetched, launch the game immediately
      const ls = document.getElementById('loading-screen');
      if (ls) ls.style.opacity = '0';
      
      setTimeout(() => {
        // Attempt to open the game in a fresh, final window / about:blank
        const gameWin = window.open('about:blank', '_blank', 'width=' + screen.availWidth + ',height=' + screen.availHeight + ',menubar=no,status=no,toolbar=no');
        
        if (gameWin) {
          gameWin.document.open();
          gameWin.document.write(fullHtml);
          gameWin.document.close();
          // Close this intermediate loading window
          window.close();
        } else {
          // Safety Fallback: Load in THIS window if the pop-up is blocked
          document.open();
          document.write(fullHtml);
          document.close();
        }
      }, 800);
    }

    run();

    // Sound trigger for modern browsers
    (function() {
        const boot = document.getElementById('boot-audio');
        const trigger = () => {
            if (boot) boot.play().catch(()=>{});
            ['mousemove', 'mousedown', 'keydown', 'touchstart'].forEach(e =>
                window.removeEventListener(e, trigger)
            );
        };
        ['mousemove', 'mousedown', 'keydown', 'touchstart'].forEach(e =>
            window.addEventListener(e, trigger)
        );
        if (boot) boot.play().catch(()=>{});
    })();
  </script>
</body>
</html>
